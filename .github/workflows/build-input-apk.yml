name: Build DumInputApk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools

      - name: Install Android SDK components
        shell: pwsh
        run: |
          sdkmanager `
            "platform-tools" `
            "platforms;android-35" `
            "build-tools;35.0.0"

      - name: Build embedded APK
        shell: pwsh
        run: |
          .\build-input-helper.ps1 `
            -SdkRoot $env:ANDROID_HOME `
            -Platform "android-35" `
            -BuildToolsVersion "35.0.0" `
            -BuildApk

      - name: Upload DumInputApk.h
        uses: actions/upload-artifact@v4
        with:
          name: DumInputApk
          path: input-helper/build/embedded/DumInputApk.h
